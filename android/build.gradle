buildscript {
    // Evaluated before everything else, so read the host app's Kotlin version directly.
    def kotlinVersion = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "2.1.20"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// Runs codegen for the TurboModule specs in src/specs. DocumentKit is New Architecture only.
apply plugin: "com.facebook.react"

android {
    namespace "com.documentkit"
    // Fixed, not taken from the app: CameraX 1.6 and Media3 1.11 need compileSdk 36,
    // and the code uses Android 10 APIs (MediaStore.Downloads) without version checks.
    // A lower app minSdkVersion then fails the manifest merge instead of crashing on old phones.
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 29
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }

    lint {
        // Dependency versions below are minimums; the host app resolves the actual version.
        disable "GradleDependency"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    // FileProvider for the OS camera's output URI.
    implementation "androidx.core:core-ktx:1.18.0"
    // Photo orientation, so reported width/height match how the photo displays.
    implementation "androidx.exifinterface:exifinterface:1.3.3"
    // PDF viewer pages and the zoomable image view (both already in React Native apps).
    implementation "androidx.recyclerview:recyclerview:1.3.1"
    implementation "androidx.appcompat:appcompat:1.7.1"
    // In-app video/audio streaming.
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    // In-app camera. Gradle resolves one CameraX for the whole app, so an app that
    // also ships another CameraX library (e.g. react-native-vision-camera) sets
    // `ext.documentKitCameraXVersion` to that library's version (see README).
    def cameraXVersion = safeExtGet("documentKitCameraXVersion", "1.6.2")
    implementation "androidx.camera:camera-camera2:$cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraXVersion"
    implementation "androidx.camera:camera-video:$cameraXVersion"
    implementation "androidx.camera:camera-view:$cameraXVersion"
}
